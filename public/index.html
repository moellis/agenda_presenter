<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda-Presenter</title>
<style>
body{font-family:"Segoe UI",Arial,sans-serif;background:#f3f5f8;color:#1f2933;margin:0;padding:2rem 1rem}
main{max-width:40rem;margin:0 auto;background:#fff;border-radius:1rem;padding:2rem;box-shadow:0 1px 10px rgba(16,24,40,.08)}
h1{margin:0 0 .3rem;color:#00589b} p{color:#667085} ul{list-style:none;padding:0}
li a{display:flex;justify-content:space-between;padding:.9rem 1rem;border:1px solid #e4e8ee;border-radius:.6rem;margin-bottom:.6rem;text-decoration:none;color:inherit;font-weight:600}
li a:hover{border-color:#00589b;background:#f0f6fb} small{color:#667085;font-weight:400}
.admin{display:inline-block;margin-top:1rem;color:#00589b}
</style></head>
<body><main>
<h1 id="t">Agenda</h1><p>Anzeige für einen Raum öffnen (Vollbild mit F11):</p>
<ul id="rooms"></ul>
<ul><li id="partnerLi" hidden><a href="/partner">Partner-Seite <small>/partner</small></a></li></ul>
<a class="admin" href="/admin">Admin-Bereich →</a>
</main>
<script>
fetch('/api/state').then(r=>r.json()).then(s=>{
  document.getElementById('t').textContent=s.settings.title;
  const ul=document.getElementById('rooms');
  for(const r of s.rooms){const li=document.createElement('li'),a=document.createElement('a');
    a.href='/raum/'+r.slug;a.textContent=r.name+(r.is_main?' (Hauptbühne)':'');
    const sm=document.createElement('small');sm.textContent='/raum/'+r.slug;a.append(sm);li.append(a);ul.append(li);}
  if(s.settings.partners_enabled)document.getElementById('partnerLi').hidden=false;
});
</script></body></html>
