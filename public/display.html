<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda</title>
<link rel="stylesheet" href="/display.css">
</head>
<body>
<div id="app">
  <header>
    <div class="logo-slot left"><img id="logo1" alt="" hidden><h1 id="title" hidden></h1></div>
    <div class="head-title">
      <div class="headline" id="headline"><span class="arr">»</span> <b id="hl1"></b> <span id="hl2"></span></div>
      <div id="subtitle"></div>
    </div>
    <div class="head-right">
      <img id="logo2" alt="" hidden>
      <div class="clock" id="clock"></div>
    </div>
  </header>

  <main id="agendaView">
    <section class="focus">
      <article class="card now" id="nowCard">
        <div class="label"><span class="pulse"></span><span id="nowLabel">Jetzt</span></div>
        <div id="nowBody"></div>
        <div class="progress" id="progressWrap"><div id="progress"></div></div>
      </article>
      <article class="card next" id="nextCard">
        <div class="label">Als Nächstes</div>
        <div id="nextBody"></div>
      </article>
    </section>
    <section class="list-wrap">
      <h2>Programm</h2>
      <ol id="list"></ol>
    </section>
  </main>

  <main id="partnerView" hidden>
    <div id="partnerGrid"></div>
  </main>

  <div id="net" role="img" aria-label="Keine Verbindung zum Server" title="Keine Verbindung zum Server" hidden>
    <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/>
      <circle cx="12" cy="19.6" r="1" fill="currentColor" stroke="none"/>
      <path d="M3.5 3.5l17 17" stroke="#e3000f" stroke-width="2.2"/>
    </svg>
  </div>
</div>
<script src="/display.js"></script>
</body>
</html>
